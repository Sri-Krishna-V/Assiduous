apiVersion: apps/v1
kind: Deployment
metadata:
  name: assiduous-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assiduous-app
  template:
    metadata:
      labels:
        app: assiduous-app
    spec:
      containers:
        - name: assiduous-app
          image: registry.digitalocean.com/cicd-registry/assiduous:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: assiduous-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: assiduous-service
spec:
  selector:
    app: assiduous-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
