apiVersion: apps/v1
kind: Deployment
metadata:
  name: assiduous-app
  namespace: default
  labels:
    app: assiduous-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: assiduous-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: assiduous-app
    spec:
      imagePullSecrets:
        - name: registry-assiduous

      containers:
        - name: assiduous-app
          image: registry.digitalocean.com/cicd-registry/assiduous:IMAGE_TAG
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: assiduous-secrets

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: assiduous-service
  namespace: default
  labels:
    app: assiduous-app
spec:
  type: LoadBalancer
  selector:
    app: assiduous-app
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 3000
