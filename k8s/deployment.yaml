apiVersion: apps/v1
kind: Deployment
metadata:
  name: assiduous-app
  namespace: default
  labels:
    app: assiduous-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: assiduous-app

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%

  template:
    metadata:
      labels:
        app: assiduous-app

    spec:
      containers:

      - name: assiduous-app
        image: registry.digitalocean.com/cicd-registry/assiduous:d96ed9832035679c8b8fc5b7af2cf4bfb25f069e
        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        envFrom:
        - secretRef:
            name: assiduous-secrets

        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi

        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 10

        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 30