name: Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main
      - dev
      - feat/auto

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DigitalOcean Registry
        run: echo "${{ secrets.DO_TOKEN }}" | docker login registry.digitalocean.com -u ${{ secrets.DO_TOKEN }} --password-stdin

      - name: Build Docker image
        run: docker build -t registry.digitalocean.com/cicd-registry/assiduous:${{ github.sha }} .

      - name: Push Docker image
        run: docker push registry.digitalocean.com/cicd-registry/assiduous:${{ github.sha }}

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_TOKEN }}

      - name: Configure Kubernetes
        run: doctl kubernetes cluster kubeconfig save cicd-cluster

      - name: Create or update Kubernetes secret
        run: |
          kubectl create secret generic assiduous-secrets \
            --from-literal=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --from-literal=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes manifests
        run: |
          sed -i 's|assiduous:latest|assiduous:${{ github.sha }}|g' k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/assiduous-app --timeout=120s
